name: Simulator evidence and acceptance (integration pending)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # nightly at 02:00 UTC
    - cron: "0 2 * * *"

concurrency:
  group: sim-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-regression:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy

    strategy:
      fail-fast: false
      matrix:
        ros_distro: [ humble ]
        scenario: [ mars_flat ]   # add mars_rocks, lander_tether_site later

    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
      ROS_WS: ros_ws
      SCENARIO: ${{ matrix.scenario }}
      # Requested Gazebo seed; not proof of repeatability
      SEED: "42"
      RUN_SECONDS: "45"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (ROS + tools)
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip python3-venv python3-rosdep \
            python3-colcon-common-extensions \
            python3-vcstool \
            libunwind-dev \
            ros-${ROS_DISTRO}-gazebo-ros-pkgs \
            ros-${ROS_DISTRO}-ros-base \
            ros-${ROS_DISTRO}-rosbag2 \
            ros-${ROS_DISTRO}-rosbag2-storage-mcap \
            ros-${ROS_DISTRO}-robot-localization \
            ros-${ROS_DISTRO}-nav2-bringup \
            ros-${ROS_DISTRO}-ros2-control \
            ros-${ROS_DISTRO}-ros2-controllers

      - name: Init rosdep
        shell: bash
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update

      - name: Resolve ROS dependencies (rosdep)
        shell: bash
        run: |
          cd "${ROS_WS}"
          rosdep install --from-paths src --ignore-src -r -y

      - name: Install supported schema validator
        run: python3 -m pip install -r requirements-test.txt

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          cd "${ROS_WS}"
          colcon build --event-handlers console_direct+ --symlink-install

      - name: Pre-flight checks (required scripts/files)
        shell: bash
        run: |
          set -e
          test -d "scenarios/${SCENARIO}" || (echo "Missing scenarios/${SCENARIO}" && exit 1)
          test -f "scripts/run_sim_batch.py" || (echo "Missing scripts/run_sim_batch.py (required)" && exit 1)
          test -f "scripts/evaluate_metrics.py" || (echo "Missing scripts/evaluate_metrics.py (required)" && exit 1)
          test -f "datasets/schemas/run_metadata.schema.json" || (echo "Missing datasets/schemas/run_metadata.schema.json (required)" && exit 1)

      - name: Simulator clock and node-topic smoke (no motion claim)
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source ros_ws/install/setup.bash
          export GAZEBO_MODEL_PATH="$PWD/ros_ws/src/rover_sim_gazebo/models:${GAZEBO_MODEL_PATH:-}"
          export GAZEBO_PLUGIN_PATH="$PWD/ros_ws/install/rover_sim_gazebo/lib:${GAZEBO_PLUGIN_PATH:-}"
          python3 scripts/sim_smoke.py --out analysis/sim-smoke.json

      - name: Record exploratory scenario evidence
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source ros_ws/install/setup.bash
          export GAZEBO_MODEL_PATH="$PWD/ros_ws/src/rover_sim_gazebo/models:${GAZEBO_MODEL_PATH:-}"
          export GAZEBO_PLUGIN_PATH="$PWD/ros_ws/install/rover_sim_gazebo/lib:${GAZEBO_PLUGIN_PATH:-}"
          python3 scripts/run_sim_batch.py --backend gazebo --scenario "${SCENARIO}" \
            --seed "${SEED}" --duration "${RUN_SECONDS}" --runs 1 --no-nav2 --report analysis/regression-batch.json

      - name: Evaluate explicit acceptance (fails when evidence or thresholds are missing)
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source ros_ws/install/setup.bash
          python3 scripts/gate_batch.py analysis/regression-batch.json --thresholds "scenarios/${SCENARIO}/scenario.yaml"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-regression-${{ matrix.ros_distro }}-${{ matrix.scenario }}
          path: |
            datasets/**
            analysis/**
            ros_ws/log/**
          if-no-files-found: ignore
